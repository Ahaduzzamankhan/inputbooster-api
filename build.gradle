plugins {
    id "fabric-loom" version "1.14.10"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = "FabricMC"; url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = targetJavaVersion
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
    manifest {
        attributes(
            "Implementation-Title": "InputBooster API",
            "Implementation-Version": project.version
        )
    }
}

javadoc {
    options.encoding = "UTF-8"
    options.addStringOption("Xdoclint:none", "-quiet")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "InputBooster API"
                description = "Public API for mods that depend on InputBooster"
                url = "https://github.com/ahaduzzamankhan/inputbooster"
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "ahaduzzamankhan"
                        name = "Ahaduzzaman Khan"
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "local"
            url = uri("${rootProject.buildDir}/repo")
        }
    }
}
